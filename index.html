<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Tablero</title>
<style>
  :root { --fondo:#0a1013; --tarjeta:#111a1f; --tarjeta2:#16222a; --linea:#22323b; --tinta:#e9eff1; --suave:#8fa2ab; --verde:#2dd4bf; --verde2:#0f766e; --ambar:#f5b454; --rojo:#f87171; --azul:#60a5fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--tinta); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  header { display:flex; align-items:center; gap:12px; padding:18px 16px 6px; max-width:1180px; margin:0 auto; }
  h1 { margin:0; font-size:22px; letter-spacing:-.01em; flex:1; }
  h1 small { display:block; font-size:13px; font-weight:400; color:var(--suave); margin-top:2px; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .btn { min-height:44px; padding:0 16px; border:1px solid var(--linea); border-radius:10px; background:var(--tarjeta2); font-weight:600; }
  .btn:hover { border-color:var(--verde); }
  main { max-width:1180px; margin:0 auto; padding:10px 16px 60px; display:grid; gap:12px; grid-template-columns:repeat(12, 1fr); }
  .t { background:var(--tarjeta); border:1px solid var(--linea); border-radius:14px; padding:16px; grid-column:span 12; min-width:0; }
  .t h2 { margin:0 0 12px; font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--suave); display:flex; align-items:center; gap:8px; }
  .t h2 span { margin-left:auto; text-transform:none; letter-spacing:0; font-weight:400; }
  .kpi { grid-column:span 6; }
  .kpi b { display:block; font-size:clamp(22px, 6vw, 30px); letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.1; }
  .kpi p { margin:6px 0 0; font-size:13px; color:var(--suave); }
  .sube { color:var(--rojo); } .baja { color:var(--verde); }
  .dias { display:flex; align-items:flex-end; gap:3px; height:150px; padding-top:6px; }
  .dias .d { flex:1; min-width:0; display:flex; flex-direction:column-reverse; height:100%; position:relative; }
  .dias .d i { display:block; border-radius:2px 2px 0 0; min-height:0; }
  .dias .d .p { background:var(--verde); } .dias .d .n { background:var(--azul); border-radius:2px 2px 0 0; }
  .dias .d.hoy::after { content:""; position:absolute; left:0; right:0; bottom:-6px; height:3px; border-radius:2px; background:var(--ambar); }
  .g { display:flex; flex-direction:column; } .g .dias { flex:1; height:auto; min-height:150px; }
  .eje { display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:var(--suave); }
  .ley { display:flex; gap:14px; font-size:12px; color:var(--suave); flex-wrap:wrap; }
  .ley i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .fila { display:grid; grid-template-columns:minmax(90px, 30%) 1fr auto; gap:10px; align-items:center; padding:7px 0; font-size:14px; }
  .fila + .fila { border-top:1px solid var(--linea); }
  .fila .barra { height:8px; border-radius:4px; background:var(--tarjeta2); overflow:hidden; }
  .fila .barra i { display:block; height:100%; border-radius:4px; background:var(--verde); }
  .fila em { font-style:normal; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .par { display:flex; justify-content:space-between; gap:12px; padding:9px 0; font-size:14px; }
  .par + .par { border-top:1px solid var(--linea); }
  .par em { font-style:normal; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; }
  .par small { display:block; color:var(--suave); font-size:12px; font-weight:400; }
  .total { border-top:2px solid var(--linea) !important; font-weight:700; }
  .pest { display:inline-flex; margin-left:auto; border:1px solid var(--linea); border-radius:9px; overflow:hidden; }
  .pest button { min-height:36px; padding:0 12px; border:0; background:transparent; font-size:13px; color:var(--suave); text-transform:none; letter-spacing:0; }
  .pest button[aria-pressed="true"] { background:var(--tarjeta2); color:var(--tinta); font-weight:600; }
  .chip { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; background:var(--tarjeta2); color:var(--suave); }
  .chip.g { color:var(--rojo); } .chip.i { color:var(--verde); } .chip.c { color:var(--ambar); }
  .vacio { color:var(--suave); font-size:14px; margin:4px 0; }
  .nota { color:var(--suave); font-size:12px; margin:10px 0 0; }
  #aviso { grid-column:span 12; padding:14px 16px; border-radius:12px; background:#2a1d10; border:1px solid #5a3d14; color:#f8d9a0; display:none; }
  #aviso input { width:100%; min-height:44px; margin:10px 0; padding:0 12px; border-radius:9px; border:1px solid #5a3d14; background:#1a1209; color:inherit; font:inherit; }
  @media (min-width:760px) { .kpi { grid-column:span 3; } .m { grid-column:span 6; } .g { grid-column:span 8; } .c { grid-column:span 4; } }
</style>
</head>
<body>
<header>
  <h1>Tablero<small id="fecha">Cargando…</small></h1>
  <button class="btn" id="recargar" type="button">Actualizar</button>
</header>
<main id="main">
  <div id="aviso" role="alert"></div>
  <section class="t kpi"><h2>En mis cuentas</h2><b id="k-disp">—</b><p id="k-disp-p"></p></section>
  <section class="t kpi"><h2>Gastado este mes</h2><b id="k-gasto">—</b><p id="k-gasto-p"></p></section>
  <section class="t kpi"><h2>Ganado este mes</h2><b id="k-gan">—</b><p id="k-gan-p"></p></section>
  <section class="t kpi"><h2>Me deben</h2><b id="k-cob">—</b><p id="k-cob-p"></p></section>

  <section class="t g"><h2>Gasto por día · últimos 30 días</h2>
    <div class="dias" id="dias" role="img" aria-label="Gasto por día"></div>
    <div class="eje"><span id="eje-a"></span><span class="ley"><span><i style="background:var(--verde)"></i>Personal</span><span><i style="background:var(--azul)"></i>Negocio</span><span><i style="background:var(--ambar)"></i>Hoy</span></span><span id="eje-b"></span></div>
  </section>
  <section class="t c"><h2>Cuentas</h2><div id="cuentas"></div></section>

  <section class="t m"><h2>En qué se fue este mes
    <span class="pest" role="group" aria-label="Ver gastos de"><button type="button" data-amb="personal" aria-pressed="true">Personal</button><button type="button" data-amb="negocio" aria-pressed="false">Negocio</button></span></h2>
    <div id="cats"></div></section>
  <section class="t m"><h2>Negocio este mes</h2><div id="negocio"></div></section>

  <section class="t m"><h2>Ventas <span id="leads-al"></span></h2><div id="leads"></div><div id="proximos"></div></section>
  <section class="t m"><h2>Por cobrar</h2><div id="cobrar"></div></section>

  <section class="t"><h2>Últimos movimientos</h2><div id="ultimos"></div></section>
</main>

<script>
const DIRECCION = 'https://n8n-production-003b9.up.railway.app/webhook/tablero';
const CUENTAS = { ahorro: 'Coopeuch ahorro', bci: 'BCI', chile: 'Banco de Chile', coopeuch: 'Coopeuch vista', falabella: 'Falabella débito', falabella_credito: 'Falabella crédito', mach: 'MACH' };
const DE_CREDITO = ['falabella_credito'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plata = (n) => { const v = Math.round(Number(n) || 0); return (v < 0 ? '-' : '') + '$' + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
const corta = (iso) => { const [, m, d] = String(iso).split('-'); return Number(d) + ' ' + MESES[Number(m) - 1].slice(0, 3); };
const larga = (iso) => { const [a, m, d] = String(iso).split('-'); return Number(d) + ' de ' + MESES[Number(m) - 1] + ' de ' + a; };
const sumar = (l, f) => l.filter(f).reduce((s, x) => s + Number(x.total ?? x.monto ?? x.saldo ?? 0), 0);
const guardado = { leer() { try { return localStorage.getItem('tablero-clave') || ''; } catch { return ''; } }, poner(v) { try { localStorage.setItem('tablero-clave', v); } catch {} }, borrar() { try { localStorage.removeItem('tablero-clave'); } catch {} } };
let datos = null, ambito = 'personal';

/* La clave llega una sola vez en el enlace, después del #, que el navegador no manda a ningún servidor. Se guarda en este aparato y se quita de la dirección. */
function leerEnlace() {
  const m = /[#&]k=([A-Za-z0-9_-]{20,})/.exec(location.hash);
  if (m) { guardado.poner(m[1]); history.replaceState(null, '', location.pathname + location.search); }
  return !!m;
}
leerEnlace();
window.addEventListener('hashchange', () => { if (leerEnlace()) cargar(); });      /* por si abre el enlace con el tablero ya abierto */

function aviso(html) { const a = $('#aviso'); a.style.display = html ? 'block' : 'none'; a.innerHTML = html || ''; }
function pedirClave(motivo) {
  aviso('<b>' + esc(motivo) + '</b><br>Abra el enlace del tablero que le llegó por Telegram, o pegue aquí la clave:' +
    '<input id="clave" type="password" autocomplete="off" aria-label="Clave del tablero"><button class="btn" id="usar" type="button">Entrar</button>');
  $('#usar').onclick = () => { const v = $('#clave').value.trim(); if (v) { guardado.poner(v); cargar(); } };
}

async function cargar() {
  $('#recargar').disabled = true; $('#fecha').textContent = 'Cargando…';
  try {
    let r;
    if (new URLSearchParams(location.search).has('muestra')) r = await (await fetch('muestra.json', { cache: 'no-store' })).json();
    else {
      const clave = guardado.leer(); if (!clave) { pedirClave('Falta la clave del tablero.'); $('#fecha').textContent = 'Sin clave'; return; }
      /* Texto plano y sin encabezados propios: así el navegador no pide permisos previos y la clave no queda en ninguna dirección. */
      const resp = await fetch(DIRECCION, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ clave }), cache: 'no-store', referrerPolicy: 'no-referrer' });
      r = await resp.json();
    }
    if (!r || r.ok !== true || !r.datos) {
      if (r && r.error === 'no autorizado') { guardado.borrar(); pedirClave('La clave no es correcta.'); } else aviso('<b>El servidor respondió, pero sin datos.</b> Pruebe «Actualizar» en un momento.');
      $('#fecha').textContent = 'Sin datos'; return;
    }
    datos = r.datos; aviso(''); pintar();
  } catch (e) {
    aviso('<b>No se pudo conectar con el servidor.</b> Revise su conexión y apriete «Actualizar».' + (datos ? ' Lo que ve abajo es de la última vez que cargó.' : ''));
    $('#fecha').textContent = 'Sin conexión';
  } finally { $('#recargar').disabled = false; }
}

function pintar() {
  const d = datos, mes = d.mes || [], ant = d.mes_anterior || [];
  $('#fecha').textContent = larga(d.hoy) + (new URLSearchParams(location.search).has('muestra') ? ' · DATOS DE MUESTRA' : '');

  /* --- tarjetas de arriba --- */
  const cuentas = (d.cuentas || []).filter(c => !DE_CREDITO.includes(c.nombre)), deudas = (d.cuentas || []).filter(c => DE_CREDITO.includes(c.nombre));
  const disp = sumar(cuentas, () => true), deuda = sumar(deudas, () => true);
  $('#k-disp').textContent = cuentas.length ? plata(disp) : '—';
  $('#k-disp-p').textContent = !cuentas.length ? 'Escríbale al bot «saldo mach 20000» para empezar' : deuda ? 'Tarjeta de crédito: debe ' + plata(deuda) : cuentas.length + (cuentas.length === 1 ? ' cuenta' : ' cuentas');
  const gP = sumar(mes, x => x.tipo === 'gasto' && x.ambito === 'personal'), gN = sumar(mes, x => x.tipo === 'gasto' && x.ambito === 'negocio'), gAnt = sumar(ant, x => x.tipo === 'gasto');
  $('#k-gasto').textContent = plata(gP + gN);
  $('#k-gasto-p').textContent = 'Personal ' + plata(gP) + ' · negocio ' + plata(gN);
  const iP = sumar(mes, x => x.tipo === 'ingreso' && x.ambito === 'personal'), iN = sumar(mes, x => x.tipo === 'ingreso' && x.ambito === 'negocio'), iAnt = sumar(ant, x => x.tipo === 'ingreso');
  $('#k-gan').textContent = plata(iP + iN);
  $('#k-gan-p').textContent = (iP ? 'Personal ' + plata(iP) + ' · negocio ' + plata(iN) : 'Todo del negocio') + (iAnt ? ' · mes pasado ' + plata(iAnt) : '');
  const cobBot = sumar(d.por_cobrar_bot || [], () => true), cobCrm = Number((d.crm || {}).por_cobrar || 0);
  $('#k-cob').textContent = plata(Math.max(cobBot, cobCrm));
  $('#k-cob-p').textContent = cobBot && cobCrm ? 'Anotado en el bot ' + plata(cobBot) + ' · en el CRM ' + plata(cobCrm) : cobBot ? 'Anotado en el bot' : cobCrm ? 'Según el CRM' : 'Nada pendiente anotado';

  /* --- gasto por día --- */
  const dias = []; const base = new Date(d.hoy + 'T12:00:00Z');
  for (let i = 29; i >= 0; i--) { const f = new Date(base); f.setUTCDate(f.getUTCDate() - i); dias.push(f.toISOString().slice(0, 10)); }
  const porDia = dias.map(f => ({ f, p: sumar(d.dias || [], x => x.fecha === f && x.tipo === 'gasto' && x.ambito === 'personal'), n: sumar(d.dias || [], x => x.fecha === f && x.tipo === 'gasto' && x.ambito === 'negocio') }));
  const tope = Math.max(1, ...porDia.map(x => x.p + x.n));
  $('#dias').innerHTML = porDia.map(x => '<div class="d' + (x.f === d.hoy ? ' hoy' : '') + '" title="' + corta(x.f) + ': ' + plata(x.p + x.n) + '">' +
    '<i class="p" style="height:' + (100 * x.p / tope).toFixed(1) + '%"></i><i class="n" style="height:' + (100 * x.n / tope).toFixed(1) + '%"></i></div>').join('');
  $('#dias').setAttribute('aria-label', 'Gasto por día. El día más alto fue de ' + plata(tope) + '.');
  $('#eje-a').textContent = corta(dias[0]); $('#eje-b').textContent = 'máx. ' + plata(tope);

  /* --- cuentas --- */
  $('#cuentas').innerHTML = !(d.cuentas || []).length ? '<p class="vacio">Todavía no hay saldos. Escríbale al bot «saldo mach 20000».</p>' :
    cuentas.map(c => '<div class="par"><span>' + esc(CUENTAS[c.nombre] || c.nombre) + '<small>al ' + corta(c.actualizado) + '</small></span><em>' + plata(c.saldo) + '</em></div>').join('') +
    (cuentas.length > 1 ? '<div class="par total"><span>Total</span><em>' + plata(disp) + '</em></div>' : '') +
    deudas.map(c => '<div class="par"><span>💳 ' + esc(CUENTAS[c.nombre]) + '<small>lo que debe</small></span><em style="color:var(--rojo)">' + plata(c.saldo) + '</em></div>').join('');

  pintarCategorias();

  /* --- negocio --- */
  $('#negocio').innerHTML = '<div class="par"><span>Ganado</span><em style="color:var(--verde)">' + plata(iN) + '</em></div>' +
    '<div class="par"><span>Gastado</span><em>' + plata(gN) + '</em></div>' +
    '<div class="par total"><span>Queda</span><em style="color:' + (iN - gN < 0 ? 'var(--rojo)' : 'var(--verde)') + '">' + plata(iN - gN) + '</em></div>' +
    '<p class="nota">Solo lo que usted le anota al bot como «negocio». ' + (Number((d.crm || {}).ganado) ? 'El CRM registra ' + plata(d.crm.ganado) + ' cobrados en total.' : '') + '</p>';

  /* --- ventas --- */
  const ORDEN = ['nuevo', 'contactado', 'conversando', 'propuesta', 'cliente', 'ganado', 'descartado'];
  const leads = (d.leads || []).slice().sort((a, b) => (ORDEN.indexOf(a.estado) + 99) % 99 - (ORDEN.indexOf(b.estado) + 99) % 99), topeL = Math.max(1, ...leads.map(l => l.n));
  $('#leads-al').textContent = d.leads_al ? 'al ' + corta(d.leads_al) : '';
  $('#leads').innerHTML = leads.length ? leads.map(l => '<div class="fila"><span>' + esc(l.estado) + '</span><span class="barra"><i style="width:' + (100 * l.n / topeL).toFixed(0) + '%;background:' + (l.estado === 'descartado' ? 'var(--linea)' : 'var(--azul)') + '"></i></span><em>' + l.n + '</em></div>').join('')
    : '<p class="vacio">No hay prospectos en la base.</p>';
  $('#proximos').innerHTML = (d.proximos || []).length ? '<p class="nota" style="margin-top:14px">Lo que viene</p>' + d.proximos.map(p => '<div class="par"><span>' + esc(p.cuenta || '—') + '<small>' + esc(p.proxima || p.estado) + '</small></span><em>' + corta(p.fecha) + '</em></div>').join('') : '';

  /* --- por cobrar --- */
  const cb = (d.por_cobrar_bot || []).map(x => ({ quien: x.concepto, que: 'anotado el ' + corta(x.fecha), monto: x.monto }));
  const cc = (d.por_cobrar_crm || []).map(x => ({ quien: String(x.cliente).replace(/^(cliente|lead)-/, '').replace(/-/g, ' '), que: x.concepto, monto: x.monto }));
  $('#cobrar').innerHTML = (cb.length || cc.length) ?
    (cb.length ? '<p class="nota" style="margin:0 0 4px">Anotado en el bot</p>' + cb.map(x => '<div class="par"><span>' + esc(x.quien) + '<small>' + esc(x.que) + '</small></span><em>' + plata(x.monto) + '</em></div>').join('') : '') +
    (cc.length ? '<p class="nota" style="margin:' + (cb.length ? '14px' : '0') + ' 0 4px">En el CRM</p>' + cc.map(x => '<div class="par"><span>' + esc(x.quien) + '<small>' + esc(x.que) + '</small></span><em>' + plata(x.monto) + '</em></div>').join('') : '') +
    (cb.length && cc.length ? '<p class="nota">Son dos listas distintas: si anotó lo mismo en las dos, no lo sume dos veces.</p>' : '')
    : '<p class="vacio">Nadie le debe nada, según lo anotado.</p>';

  /* --- últimos movimientos --- */
  const SIGNO = { gasto: ['g', 'Gasto', '-'], ingreso: ['i', 'Ingreso', '+'], por_cobrar: ['c', 'Por cobrar', ''] };
  $('#ultimos').innerHTML = (d.ultimos || []).length ? d.ultimos.map(m => { const s = SIGNO[m.tipo] || ['', m.tipo, '']; return '<div class="par"><span>' + esc(m.concepto) +
    '<small>' + corta(m.fecha) + ' · ' + esc(m.ambito) + (m.tipo === 'gasto' ? ' · ' + esc(m.categoria) : '') + (m.cuenta ? ' · ' + esc(CUENTAS[m.cuenta] || m.cuenta) : '') + '</small></span>' +
    '<em><span class="chip ' + s[0] + '">' + s[1] + '</span> ' + s[2] + plata(m.monto) + '</em></div>'; }).join('') : '<p class="vacio">Todavía no hay movimientos. Escríbale al bot «gasté 2100 en almuerzo».</p>';
}

function pintarCategorias() {
  const filas = (datos.mes || []).filter(x => x.tipo === 'gasto' && x.ambito === ambito).sort((a, b) => b.total - a.total), tope = Math.max(1, ...filas.map(x => Number(x.total)));
  const total = sumar(filas, () => true);
  $('#cats').innerHTML = filas.length ? filas.map(x => '<div class="fila"><span>' + esc(x.categoria) + '</span><span class="barra"><i style="width:' + (100 * x.total / tope).toFixed(0) + '%;background:' + (ambito === 'negocio' ? 'var(--azul)' : 'var(--verde)') + '"></i></span><em>' + plata(x.total) + '</em></div>').join('') +
    '<div class="par total"><span>Total ' + ambito + '</span><em>' + plata(total) + '</em></div>' : '<p class="vacio">Sin gastos de ' + ambito + ' anotados este mes.</p>';
}
document.querySelectorAll('.pest button').forEach(b => b.addEventListener('click', () => {
  ambito = b.dataset.amb; document.querySelectorAll('.pest button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); if (datos) pintarCategorias();
}));
$('#recargar').addEventListener('click', cargar);
cargar();
</script>
</body>
</html>
